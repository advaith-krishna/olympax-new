<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Events | Olympax Sports Academy</title>
<style>
  :root{
    --navy:#0a1128;
    --navy-deep:#050a1a;
    --gold:#d4af37;
    --gold-soft:#f0d97a;
    --line: rgba(212,175,55,0.25);
    --text: #eef1f8;
    --text-dim: #93a0c2;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--navy-deep);
    color:var(--text);
    font-family:'Helvetica Neue', Arial, sans-serif;
    overflow-x:hidden;
  }
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.01ms !important; transition-duration:0.01ms !important;}
  }

  .bg-field{
    position:fixed; inset:0; z-index:-1;
    background:
      radial-gradient(ellipse at 15% 15%, rgba(212,175,55,0.08), transparent 55%),
      radial-gradient(ellipse at 85% 80%, rgba(212,175,55,0.05), transparent 55%),
      linear-gradient(180deg, var(--navy) 0%, var(--navy-deep) 100%);
  }

  header{
    padding:5rem 6vw 3rem; text-align:center; position:relative;
  }
  .eyebrow{
    color:var(--gold); letter-spacing:0.4em; font-size:0.72rem;
    text-transform:uppercase; opacity:0; animation: rise 0.9s ease forwards 0.1s;
  }
  h1{
    font-size:clamp(3rem, 9vw, 6.5rem);
    font-weight:800; letter-spacing:-0.02em; line-height:1;
    margin-top:1rem;
    background:linear-gradient(120deg, var(--gold-soft), var(--gold) 40%, #fff6d8 60%, var(--gold));
    background-size:200% auto;
    -webkit-background-clip:text; background-clip:text; color:transparent;
    opacity:0; animation: rise 1s ease forwards 0.3s, shine 6s linear infinite 1.3s;
  }
  .bar{
    width:70px; height:3px; background:var(--gold); margin:1.8rem auto 0;
    opacity:0; animation: rise 0.8s ease forwards 0.6s, widen 1.2s ease forwards 0.7s;
  }
  @keyframes rise{ from{opacity:0; transform:translateY(20px);} to{opacity:1; transform:translateY(0);} }
  @keyframes widen{ from{width:0;} to{width:70px;} }
  @keyframes shine{ to{background-position:200% center;} }

  .reveal{ opacity:0; transform:translateY(30px); transition: opacity 0.8s ease, transform 0.8s ease; }
  .reveal.in{ opacity:1; transform:translateY(0); }

  main{ padding:2rem 6vw 6rem; max-width:1200px; margin:0 auto; }

  .event-row{
    display:grid; grid-template-columns:1fr 1.3fr; gap:2.5rem;
    align-items:center; padding:3.5rem 0; border-bottom:1px solid var(--line);
  }
  .event-row:last-child{ border-bottom:none; }
  .event-row.flip{ grid-template-columns:1.3fr 1fr; }
  .event-row.flip .photo-slot{ order:2; }
  .event-row.flip .event-info{ order:1; }

  .photo-slot{
    aspect-ratio:4/3; border:1px solid var(--line); border-radius:6px;
    display:flex; align-items:center; justify-content:center; flex-direction:column;
    background:linear-gradient(160deg, rgba(212,175,55,0.04), rgba(212,175,55,0));
    position:relative; overflow:hidden; cursor:pointer;
    transition: transform 0.5s ease, border-color 0.5s ease;
  }
  .photo-slot::before{
    content:''; position:absolute; inset:0;
    background:linear-gradient(120deg, transparent 20%, rgba(212,175,55,0.16) 50%, transparent 80%);
    transform:translateX(-120%); transition:transform 0.9s ease;
  }
  .photo-slot:hover{ transform:translateY(-6px); border-color:var(--gold); }
  .photo-slot:hover::before{ transform:translateX(120%); }
  .photo-slot .plus{ font-size:2.2rem; color:var(--gold); font-weight:200; }
  .photo-slot .cap{
    margin-top:0.6rem; color:var(--text-dim); font-size:0.7rem;
    letter-spacing:0.15em; text-transform:uppercase;
  }

  .event-info .tag{
    color:var(--gold); font-size:0.72rem; letter-spacing:0.3em; text-transform:uppercase;
  }
  .event-info h2{
    font-size:clamp(1.6rem, 3vw, 2.4rem); font-weight:700; margin-top:0.7rem;
  }
  .event-info .meta{
    margin-top:0.8rem; color:var(--text-dim); font-size:0.95rem; letter-spacing:0.03em;
  }
  .event-info p{
    margin-top:1.1rem; color:var(--text-dim); line-height:1.6; font-size:0.95rem; max-width:38ch;
  }

  footer{
    text-align:center; padding:3rem 6vw; color:var(--text-dim);
    font-size:0.72rem; letter-spacing:0.15em; border-top:1px solid var(--line);
  }

  @media (max-width:768px){
    .event-row, .event-row.flip{ grid-template-columns:1fr; }
    .event-row.flip .photo-slot, .event-row.flip .event-info{ order:unset; }
  }
</style>
</head>
<body>
<div class="bg-field"></div>

<header>
  <div class="eyebrow">Olympax Sports Academy</div>
  <h1>Events</h1>
  <div class="bar"></div>
</header>

<main>
  <div id="eventsList"></div>
</main>

<footer>Olympax Sports Academy — Events</footer>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script>
  const eventsClient = typeof supabasePublicClient !== 'undefined' ? supabasePublicClient : supabaseClient;

  const io = new IntersectionObserver((entries)=>{
    entries.forEach(e=>{
      if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target); }
    });
  }, {threshold:0.15});

  function safeText(s){ return s == null ? '' : String(s); }

  function getEventImageUrl(evt){
    const imageUrl = evt.image_url || evt.image || '';
    if(!imageUrl) return '';
    if(imageUrl.startsWith('http')) return imageUrl;
    try{
      const { data } = eventsClient.storage.from('events').getPublicUrl(imageUrl);
      return data?.publicUrl || '';
    }catch(e){ console.warn('Image URL error', e); return ''; }
  }

  function createEventRow(evt, index){
    const row = document.createElement('div');
    row.className = 'event-row reveal' + ((index % 2===1)?' flip':'');

    const photo = document.createElement('div');
    photo.className = 'photo-slot';

    const imgUrl = getEventImageUrl(evt);
    if(imgUrl){
      const img = document.createElement('img');
      img.src = imgUrl;
      img.alt = safeText(evt.title);
      img.style.width = '100%';
      img.style.height = '100%';
      img.style.objectFit = 'cover';
      photo.appendChild(img);
    } else {
      const plus = document.createElement('span'); plus.className='plus'; plus.textContent='+';
      const cap = document.createElement('span'); cap.className='cap'; cap.textContent='Add Photo';
      photo.appendChild(plus); photo.appendChild(cap);
    }

    const info = document.createElement('div'); info.className='event-info';
    const tag = document.createElement('div'); tag.className='tag'; tag.textContent = safeText(evt.category || 'Event');
    const h2 = document.createElement('h2'); h2.textContent = safeText(evt.title);
    const meta = document.createElement('div'); meta.className='meta'; meta.textContent = `${safeText(evt.date)} — ${safeText(evt.location)}`;
    const p = document.createElement('p'); p.textContent = safeText(evt.description);

    info.appendChild(tag); info.appendChild(h2); info.appendChild(meta); info.appendChild(p);

    row.appendChild(photo); row.appendChild(info);
    return row;
  }

  async function fetchAndRenderEvents(){
    const container = document.getElementById('eventsList');
    container.innerHTML = '';
    try{
      console.debug('[events-debug] Supabase URL:', SUPABASE_URL);
      console.debug('[events-debug] Current project ID:', SUPABASE_PROJECT_ID);

      const response = await eventsClient.from('events').select('*').order('date', { ascending: true });
      const { data, error } = response;
      console.debug('[events-debug] Raw API response:', response);
      console.debug('[events-debug] data:', data);
      console.debug('[events-debug] error:', error);

      if(error){ console.error('Failed to fetch events', error); return; }

      const renderedEvents = Array.isArray(data) ? data : [];
      console.debug('[events-debug] Final rendered array:', renderedEvents);

      if(renderedEvents.length===0){
        container.innerHTML = '<p style="color:var(--text-dim)">No events yet.</p>';
        return;
      }

      renderedEvents.forEach((evt, i)=>{
        const row = createEventRow(evt, i);
        container.appendChild(row);
      });

      // observe reveals
      const els = container.querySelectorAll('.reveal');
      els.forEach(el=>io.observe(el));
    }catch(e){ console.error(e); }
  }

  fetchAndRenderEvents();

  // realtime subscription to events table
  try{
    const channel = eventsClient.channel('events-list')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'events' }, () => {
        console.debug('[events-debug] Realtime event received; refreshing events.');
        fetchAndRenderEvents();
      })
      .subscribe();

    window.addEventListener('beforeunload', ()=>{
      try{ eventsClient.removeChannel(channel); }catch(e){}
    });
  }catch(e){ console.warn('Realtime not available', e); }
</script>
</body>
</html>
