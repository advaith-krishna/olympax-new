<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Olympax Events Admin</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body { background: #07111f; color: #f6f7fb; min-height:100vh; }
    .event-admin-shell{ max-width:760px; margin:70px auto; padding:24px; }
    .event-admin-card{ background:rgba(255,255,255,0.04); border:1px solid rgba(212,175,55,0.25); border-radius:16px; padding:24px; }
    .event-admin-card h2{ margin-bottom:8px; color:#f0d97a; }
    .status{ margin-top:16px; padding:12px 14px; border-radius:10px; border:1px solid rgba(212,175,55,0.2); background:rgba(212,175,55,0.08); color:#f3e7b9; display:none; }
    .status.error{ color:#ffb3b3; border-color:rgba(255,107,107,0.25); background:rgba(255,107,107,0.12); }
    .helper-text{ font-size:0.9rem; color:#90a0c2; margin-top:8px; }
    .hidden{ display:none !important; }
  </style>
</head>
<body>
  <section id="login-gate" class="event-admin-shell">
    <div class="event-admin-card">
      <h2>Events Admin Login</h2>
      <p>Sign in to add event records and upload event images.</p>

      <form id="login-form" class="admin-form">
        <label for="adminEmail">Email</label>
        <input type="email" id="adminEmail" placeholder="admin@example.com" autocomplete="email" required />

        <label for="adminPassword">Password</label>
        <input type="password" id="adminPassword" placeholder="Password" autocomplete="current-password" required />

        <button type="submit" class="btn-primary">Login</button>
      </form>

      <div id="loginStatus" class="status"></div>
    </div>
  </section>

  <section id="admin-panel" class="event-admin-shell hidden">
    <div class="event-admin-card">
      <div style="display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap;">
        <div>
          <h2>Add New Event</h2>
          <p>Save an event name, details, and image to Supabase.</p>
        </div>
        <button type="button" id="logoutBtn" class="btn-primary">Logout</button>
      </div>

      <form id="eventForm" class="admin-form">
        <label for="title">Event name</label>
        <input type="text" id="title" name="title" placeholder="Example: Summer Championship" required />

        <label for="category">Category</label>
        <input type="text" id="category" name="category" placeholder="Tournament / Camp / Match Day" required />

        <label for="date">Date</label>
        <input type="date" id="date" name="date" required />

        <label for="location">Location</label>
        <input type="text" id="location" name="location" placeholder="Main Ground / Indoor Arena" required />

        <label for="description">Description</label>
        <textarea id="description" name="description" rows="4" placeholder="Short event description" required></textarea>

        <label for="image">Event image</label>
        <input type="file" id="image" name="image" accept="image/*" required />

        <button type="submit" class="btn-primary">Save event</button>

        <div id="formStatus" class="status"></div>
        <div class="helper-text">Default setup expects a Supabase table named <strong>events</strong> and a storage bucket named <strong>events</strong>. Update the <code>CONFIG</code> object in <code>admin_event.js</code> if needed.</div>
      </form>
    </div>
  </section>

  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>
  <script src="admin_event.js"></script>
</body>
</html>
