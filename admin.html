<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Olympax Admin</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <section id="login-gate" style="max-width:420px;margin:120px auto;display:block;">
    <h2>Admin Login</h2>

    <form id="login-form" onsubmit="adminLogin(); return false;">
      <label for="adminEmail">Email</label>
      <input type="email" id="adminEmail" placeholder="admin@example.com" autocomplete="email" required>

      <label for="adminPassword">Password</label>
      <input type="password" id="adminPassword" placeholder="Password" autocomplete="current-password" required>

      <button type="button" onclick="adminLogin()">Login</button>
    </form>

    <p id="loginStatus" style="color:red;"></p>
  </section>

  <section id="admin-panel" style="display:none;">
    <nav id="navbar">
      <a href="index.html" class="nav-logo">OLYMPAX</a>
      <ul class="nav-links">
        <li><a href="index.html">Back to website</a></li>
        <li><a href="#admin-form" class="nav-link">Add product</a></li>
        <li><button type="button" onclick="adminLogout()">Logout</button></li>
      </ul>
    </nav>

    <main class="admin-page">
      <section class="section admin-hero">
        <div class="section-label">Admin Dashboard</div>
        <h1 class="section-title">Add New Product</h1>
        <p class="section-body">Use this form to upload an image and store product data in Supabase.</p>
      </section>

      <section class="admin-card" id="admin-form">
        <form id="productForm" class="admin-form">
          <label for="name">Product name</label>
          <input type="text" id="name" name="name" placeholder="Example: Gold Chain" required>

          <label for="category">Category</label>
          <input type="text" id="category" name="category" placeholder="Example: Jewellery" required>

          <label for="price">Price</label>
          <input type="number" id="price" name="price" placeholder="100.00" step="0.01" min="0" required>

          <label for="stock">Stock</label>
          <input type="number" id="stock" name="stock" placeholder="10" min="0" required>

          <label for="description">Description</label>
          <textarea id="description" name="description" rows="4" placeholder="Short product description" required></textarea>

          <label for="image">Product image</label>
          <input type="file" id="image" name="image" accept="image/*" required>

          <button type="submit" class="btn-primary">Save product</button>
          <div id="formStatus" class="form-status">Fill the form and upload a product image.</div>
        </form>
      </section>
    </main>
  </section>

  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>
  <script src="admin.js"></script>
</body>
</html>
